name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: futinvest/api

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=ref,event=branch

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/futinvest
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d --force-recreate api
            docker system prune -f

      - name: Health check
        run: |
          for i in {1..10}; do
            curl -sf https://staging.futinvest.io/api/health && break
            sleep 5
          done

      - name: Smoke tests
        run: |
          # 1. Health endpoint
          echo "=== Health ==="
          curl -sf https://staging.futinvest.io/api/health | grep '"status":"ok"'

          # 2. Login flow
          echo "=== Login ==="
          LOGIN=$(curl -sf -X POST https://staging.futinvest.io/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"demo@futinvest.io","password":"Demo123!"}')
          echo "$LOGIN" | grep -q '"accessToken"' && echo "Login OK"

          # 3. Authenticated endpoint
          TOKEN=$(echo "$LOGIN" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).accessToken))")
          echo "=== Dashboard ==="
          curl -sf https://staging.futinvest.io/api/dashboard \
            -H "Authorization: Bearer $TOKEN" | grep -q '"balance"' && echo "Dashboard OK"

          # 4. Public docs
          echo "=== Docs ==="
          curl -sf https://staging.futinvest.io/api/docs | grep -q "swagger" && echo "Swagger OK"

          # 5. Prometheus metrics
          echo "=== Metrics ==="
          curl -sf https://staging.futinvest.io/api/metrics/prometheus | grep -q "http_requests_total" && echo "Metrics OK"

          echo "=== All smoke tests passed ==="

  deploy-production:
    needs: [build, deploy-staging]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production

    steps:
      - name: Deploy to production K8s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            kubectl set image deployment/futinvest-api \
              futinvest-api=${{ needs.build.outputs.image-tag }} \
              -n futinvest
            kubectl rollout status deployment/futinvest-api -n futinvest --timeout=5m

      - name: Notify Sentry release
        run: |
          curl -sf https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/ \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -d '{"version":"${{ github.sha }}","projects":["futinvest-api"]}'
