# ============================================
# fut.invest - nginx Reverse Proxy
# ============================================
upstream futinvest_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name futinvest.io www.futinvest.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name futinvest.io www.futinvest.io;

    ssl_certificate     /etc/ssl/certs/futinvest.crt;
    ssl_certificate_key /etc/ssl/private/futinvest.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Frontend SPA
    location / {
        root /var/www/futinvest;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets (cacheados)
    location /assets/ {
        root /var/www/futinvest;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://futinvest_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # CORS (backend ya maneja CORS; aquí como fallback)
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://futinvest_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Logs
    access_log /var/log/nginx/futinvest_access.log;
    error_log  /var/log/nginx/futinvest_error.log;
}
