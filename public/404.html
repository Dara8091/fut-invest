<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - fut.invest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #080C14;
            color: #E8EDF5;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }
        .container { position: relative; z-index: 1; text-align: center; max-width: 520px; padding: 40px; }
        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 140px;
            font-weight: 700;
            background: linear-gradient(135deg, #00D4FF, #FF2D95);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 8px;
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(0,212,255,0.2)); }
            50% { filter: drop-shadow(0 0 60px rgba(255,45,149,0.3)); }
        }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #E8EDF5; }
        p { color: #8892B0; font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00D4FF, #0099CC);
            color: #080C14;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        .btn-primary:hover { box-shadow: 0 0 40px rgba(0,212,255,0.4); transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            color: #00D4FF;
            border: 1px solid rgba(0,212,255,0.3);
        }
        .btn-outline:hover { border-color: #00D4FF; background: rgba(0,212,255,0.05); }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 24px;
            background: rgba(13,19,33,0.9);
            border-top: 1px solid rgba(0,212,255,0.06);
            text-align: center;
        }
        .status-bar span { color: #4A5278; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
        .glow-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 0;
        }
        .glow-orb-1 { top: -100px; left: -100px; background: #00D4FF; }
        .glow-orb-2 { bottom: -100px; right: -100px; background: #FF2D95; }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="bg-grid"></div>
    <div class="container" role="alert">
        <div class="error-code">404</div>
        <h1>Ruta no encontrada</h1>
        <p>La página que buscas no existe o fue movida.<br>Verifica la URL o regresa al inicio.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <span>&larr;</span> Volver al Panel
            </a>
            <a href="/legal/terminos.html" class="btn btn-outline">
                Términos
            </a>
        </div>
    </div>
    <div class="status-bar">
        <span>fut.invest &copy; 2026 &mdash; Institutional Trust &mdash; Error 404</span>
    </div>
</body>
</html>
