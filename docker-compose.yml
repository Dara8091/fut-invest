# ============================================
# fut.invest - Docker Compose
# ============================================
version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futinvest-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=http://localhost:8000
      - JWT_SECRET=${JWT_SECRET:-cambiar_esto_en_produccion}
      - JWT_EXPIRES_IN=7d
      - DB_PATH=./data/fut_invest.db
      - TOTP_SECRET=${TOTP_SECRET:-FUTINVEST777TRUSTKEY}
      - MAX_WITHDRAWAL_PER_DAY=50000
      - MIN_WITHDRAWAL=10
    volumes:
      - futinvest-data:/app/data
      - futinvest-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  futinvest-data:
  futinvest-logs:
