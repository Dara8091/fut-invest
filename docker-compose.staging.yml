version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/futinvest/api:master
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: staging
      PORT: 3001
      FRONTEND_URL: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET}
      DB_PATH: /data/fut_invest.db
      TOTP_SECRET: ${TOTP_SECRET:?Definir TOTP_SECRET}
      PAYMENT_PROVIDER: mock
      LOG_LEVEL: debug
      METRICS_ENABLED: "true"
      WITHDRAWAL_WORKER_ENABLED: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
    volumes:
      - futinvest-data:/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "http.get('http://localhost:3001/api/health', r => {process.exit(r.statusCode===200?0:1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    logging:
      driver: none

volumes:
  futinvest-data:
